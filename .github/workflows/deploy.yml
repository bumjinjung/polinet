name: Deploy to Synology NAS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: bumjin.synology.me
        username: bumjin
        password: ${{ secrets.FTP_PASSWORD }}
        port: 10021
        local-dir: ./
        server-dir: /web/polinet/
        state-name: .ftp-deploy-sync-state.json
        exclude: |
          .git/**
          .github/**
          .gitignore
          node_modules/**
          .DS_Store
          README.md
