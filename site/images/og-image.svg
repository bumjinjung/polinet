<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 배경 그래디언트 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0054cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- 로고 배경 (흰색 박스) -->
  <rect x="50" y="50" width="400" height="530" rx="20" fill="white" opacity="0.95"/>
  
  <!-- P 로고 -->
  <text x="250" y="420" font-family="Arial, sans-serif" font-size="280" font-weight="900" text-anchor="middle" fill="#0054cc">P</text>
  
  <!-- 텍스트 영역 -->
  <text x="550" y="120" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white">
    POLINET
  </text>
  
  <text x="550" y="210" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="white" opacity="0.9">
    전문 화학 소재 에이전트
  </text>
  
  <text x="550" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="white" opacity="0.8">
    엔지니어링 플라스틱 소재
  </text>
  
  <text x="550" y="330" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="white" opacity="0.8">
    최고의 품질과 신뢰
  </text>
  
  <!-- 하단 정보 -->
  <text x="550" y="430" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="white" opacity="0.9">
    🌟 POM • PBT • PPS • LCP • COC • PEK
  </text>
  
  <text x="550" y="480" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="white" opacity="0.8">
    귀사의 성공적인 제품 개발을 지원합니다
  </text>
  
  <!-- 데코레이션 원 -->
  <circle cx="1100" cy="100" r="80" fill="white" opacity="0.1"/>
  <circle cx="100" cy="600" r="100" fill="white" opacity="0.1"/>
</svg>
